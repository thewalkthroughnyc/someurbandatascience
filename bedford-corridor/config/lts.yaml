# Level of Traffic Stress (LTS), per block, filled in from fieldwork.
#
# This file is a DATA SOURCE, not a derived output — nothing in the pipeline
# computes these values. Score each block 1-4 by riding or walking it and
# judging by the Mineta Transportation Institute / Furth LTS rubric:
#
#   1 = suitable for children; physically separated or very low speed+volume
#   2 = suitable for most adults; comfortable but shares space with traffic
#   3 = comfortable only for "confident" cyclists; moderate traffic stress
#   4 = uncomfortable for nearly everyone; high speed/volume, no separation
#
# block_id must match the ids segmentation.segment_corridor() will produce
# (from_street/to_street pairs from config/corridor.py:CROSS_STREETS, in
# order). Leave `lts: null` and `notes: ""` until you've actually surveyed
# the block — build_json.py passes null through rather than guessing.

blocks:
  - from_street: "Dean Street"
    to_street: "Atlantic Avenue"
    lts: null
    notes: ""
